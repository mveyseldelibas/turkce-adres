[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tr-adres"
version = "0.1.0"
description = "Turkish address parser: split messy Turkish addresses into province, district, neighbourhood, street and number. Offline, no dependencies."
readme = "README.md"
license = { text = "MIT AND ODbL-1.0" }
requires-python = ">=3.9"
authors = [{ name = "Mehmet Veysel Delibaş" }]
keywords = ["turkish", "turkey", "address", "address-parser", "adres", "geocoding", "gis", "nlp", "normalization", "openstreetmap"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: Turkish",
  "Natural Language :: English",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tr-adres = "tr_adres.cli:main"

[project.urls]
Homepage = "https://github.com/mveyseldelibas/tr-adres"
Issues = "https://github.com/mveyseldelibas/tr-adres/issues"
Changelog = "https://github.com/mveyseldelibas/tr-adres/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tr_adres"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "README.en.md", "LICENSE", "LICENSE-DATA.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
addopts = "--doctest-modules"
