[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turkce-adres"
version = "0.2.0"
description = "Turkish address toolkit: parse messy Turkish addresses, fix spelling, validate against 66,000+ neighbourhoods and villages, offline geocoding to street/neighbourhood level, duplicate matching, KVKK-friendly generalisation. Offline, no dependencies."
readme = "README.md"
license = { text = "MIT AND ODbL-1.0" }
requires-python = ">=3.10"
authors = [{ name = "Mehmet Veysel Delibaş" }]
keywords = ["turkish", "turkey", "address", "address-parser", "adres", "geocoding", "offline-geocoding", "deduplication", "kvkk", "gis", "openstreetmap", "mahalle"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: Turkish",
  "Natural Language :: English",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
turkce-adres = "turkce_adres.cli:main"

[project.urls]
Homepage = "https://github.com/mveyseldelibas/turkce-adres"
Issues = "https://github.com/mveyseldelibas/turkce-adres/issues"
Changelog = "https://github.com/mveyseldelibas/turkce-adres/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/turkce_adres"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "bench/zor.tsv", "README.md", "README.en.md", "LICENSE", "LICENSE-DATA.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
addopts = "--doctest-modules"
